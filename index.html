<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makita Teile App</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
      --color-bg: #f7f6f2; --color-surface: #fbfbf9; --color-surface-2: #f3f0ec; --color-border: #d4d1ca; --color-text: #28251d; --color-text-muted: #67655f; --color-primary: #01696f; --color-primary-hover:#0c4e54; --color-primary-highlight:#dbe9e7; --color-text-inverse:#f9f8f4; --shadow-md:0 8px 24px rgba(0,0,0,.08); --radius-md:.7rem; --radius-lg:1rem; --radius-full:9999px; --font-body:'Satoshi', system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #23211f; --color-border: #393836; --color-text: #e3e1dd; --color-text-muted: #a4a19a; --color-primary: #4f98a3; --color-primary-hover:#68aab3; --color-primary-highlight:#253235; --color-text-inverse:#171614; --shadow-md:0 8px 24px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:var(--font-body); font-size:var(--text-base); color:var(--color-text); background:var(--color-bg); }
    a { color:var(--color-primary); }
    .app { max-width: 1280px; margin: 0 auto; padding: var(--space-6); }
    .header { display:flex; justify-content:space-between; align-items:flex-start; gap:var(--space-4); margin-bottom:var(--space-6); }
    .title h1 { margin:0 0 var(--space-2); font-size:var(--text-xl); line-height:1.1; }
    .title p { margin:0; color:var(--color-text-muted); max-width:70ch; }
    .toolbar { display:flex; gap:var(--space-3); flex-wrap:wrap; align-items:center; }
    .btn, button { border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text); border-radius:var(--radius-full); padding:.7rem 1rem; font-size:var(--text-sm); cursor:pointer; }
    .btn.primary { background:var(--color-primary); color:var(--color-text-inverse); border-color:var(--color-primary); }
    .btn.primary:hover { background:var(--color-primary-hover); }
    .layout { display:grid; grid-template-columns: 280px 1fr; gap:var(--space-6); }
    .panel { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); }
    .sidebar { padding:var(--space-4); position:sticky; top:var(--space-4); height:max-content; }
    .sidebar h2 { font-size:var(--text-lg); margin:0 0 var(--space-4); }
    .model-list { display:grid; gap:var(--space-3); }
    .model-btn { width:100%; text-align:left; padding:var(--space-4); border-radius:var(--radius-md); background:var(--color-surface-2); border:1px solid var(--color-border); }
    .model-btn.active { background:var(--color-primary-highlight); border-color:var(--color-primary); }
    .model-btn strong { display:block; font-size:var(--text-base); margin-bottom:.15rem; }
    .model-btn span { display:block; color:var(--color-text-muted); font-size:var(--text-sm); }
    .content { padding:var(--space-5); min-height:70vh; }
    .card-grid { display:grid; grid-template-columns: 1.1fr .9fr; gap:var(--space-5); margin-bottom:var(--space-5); }
    .card { background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--space-5); }
    .card h3 { margin:0 0 var(--space-3); font-size:var(--text-lg); }
    .muted { color:var(--color-text-muted); }
    .pdf-links { display:flex; flex-wrap:wrap; gap:var(--space-3); }
    .pdf-links a { display:inline-flex; align-items:center; gap:.5rem; text-decoration:none; border:1px solid var(--color-border); border-radius:var(--radius-full); padding:.7rem 1rem; background:var(--color-surface); }
    .stats { display:grid; grid-template-columns: repeat(3,1fr); gap:var(--space-3); }
    .stat { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-4); }
    .stat .label { font-size:var(--text-xs); text-transform:uppercase; letter-spacing:.08em; color:var(--color-text-muted); margin-bottom:var(--space-2); }
    .stat .value { font-size:var(--text-lg); font-weight:700; }
    .search-row { display:flex; gap:var(--space-3); margin:0 0 var(--space-4); flex-wrap:wrap; }
    input[type="search"] { flex:1; min-width:220px; border:1px solid var(--color-border); border-radius:var(--radius-full); background:var(--color-surface); color:var(--color-text); padding:.85rem 1rem; }
    table { width:100%; border-collapse:collapse; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); overflow:hidden; }
    th, td { padding:.85rem .9rem; border-bottom:1px solid var(--color-border); text-align:left; vertical-align:top; }
    th { font-size:var(--text-sm); color:var(--color-text-muted); background:var(--color-surface-2); position:sticky; top:0; }
    tr:last-child td { border-bottom:none; }
    .pill { display:inline-block; padding:.25rem .6rem; border-radius:var(--radius-full); background:var(--color-primary-highlight); color:var(--color-primary); font-size:var(--text-xs); font-weight:700; }
    .empty { padding:var(--space-8); text-align:center; color:var(--color-text-muted); }
    .common-box { margin-top:var(--space-5); }
    .theme-toggle { width:44px; height:44px; display:grid; place-items:center; }
    @media (max-width: 920px) {
      .layout, .card-grid { grid-template-columns:1fr; }
      .sidebar { position:static; }
      .stats { grid-template-columns:1fr; }
    }
    @media (max-width: 600px) {
      .app { padding:var(--space-4); }
      .header { flex-direction:column; }
      th:nth-child(2), td:nth-child(2) { width:auto; }
      table, thead, tbody, th, td, tr { display:block; }
      thead { display:none; }
      tr { border-bottom:1px solid var(--color-border); }
      td { padding-left:42%; position:relative; }
      td::before { position:absolute; left:.9rem; top:.85rem; width:36%; font-size:var(--text-xs); color:var(--color-text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
      td:nth-child(1)::before { content:'Teil-Nr.'; }
      td:nth-child(2)::before { content:'Beschreibung'; }
      td:nth-child(3)::before { content:'Status'; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="title">
        <h1>Makita Explosionszeichnungen & Teilelisten</h1>
        <p>Für DDF483, DHP483 und DDF083 – mit direktem Wechsel zwischen den Modellen, verlinkten Service-PDFs und einer Übersicht aller identischen Teilenummern, die in allen drei Geräten vorkommen.</p>
      </div>
      <div class="toolbar">
        <button class="btn theme-toggle" data-theme-toggle aria-label="Theme umschalten">◐</button>
        <button class="btn primary" id="showCommon">Gemeinsame Teile anzeigen</button>
      </div>
    </header>

    <section class="layout">
      <aside class="panel sidebar">
        <h2>Modelle</h2>
        <div class="model-list" id="modelList"></div>
      </aside>

      <section class="panel content">
        <div id="modelView"></div>
        <div class="common-box" id="commonView"></div>
      </section>
    </section>
  </main>

  <script>
    const models = {
      DDF483: {
        title: 'Makita DDF483',
        type: '18V Brushless Bohrschrauber',
        pdfs: [
          {label:'Makita Produktseite mit Parts Breakdown', url:'https://www.makita.ca/index2.php?event=tool&id=3175'},
          {label:'Direkter PDF-Link Parts Breakdown', url:'https://www.makita.ca/data/upload/parts_breakdown/DDF483Z,%20DDF483ZB,%20DDF483RTE,%20DDF483RTEB%20-%20FEB2020.pdf'},
          {label:'PartshopDirect Teileübersicht', url:'https://www.partshopdirect.co.uk/makita-ddf483-18v-lxt-brushless-drill-driver-spare-parts-s18509/'}
        ],
        parts: [
          ['183E19-5','Housing Set'],['263005-3','Rubber Pin 6'],['252126-6','Hex Locking Nut M4-7'],['852L71-3','DDF483 Name Plate'],['266429-2','Tapping Screw 3x16'],['457020-9','Speed Change Lever'],['233025-1','Compression Spring 2'],['419041-9','F/R Change Lever'],['650689-0','Switch C3JW-2B'],['251468-5','Flat Head Screw M6x22'],['763241-6','Keyless Drill Chuck 13'],['123587-6','Change Lever Assy'],['123868-8','Gear Assembly'],['266490-9','Tapping Screw PT 2x6'],['620555-5','Controller'],['629228-7','Stator'],['619410-6','Rotor'],['643874-2','Terminal'],['620549-0','LED Circuit'],['251314-2','+ Screw M4x12'],['346317-0','Hook'],['450128-8','Battery Cover'],['197600-6','Battery BL1830B Set'],['197280-8','Battery BL1850B Set']
        ]
      },
      DHP483: {
        title: 'Makita DHP483',
        type: '18V Brushless Schlagbohrschrauber',
        pdfs: [
          {label:'Makita Canada Parts Breakdown PDF', url:'https://www.makita.ca/data/upload/parts_breakdown/DHP483Z,%20DHP483ZB-%20FEB2020.pdf'},
          {label:'Powertoolspares Diagrammseite', url:'https://www.powertoolspares.com/makita/drills/dhp483.m'},
          {label:'PartshopDirect Teileübersicht', url:'https://www.partshopdirect.co.uk/makita-dhp483-18v-brushless-cordless-combidrill-spare-parts-s18482/'}
        ],
        parts: [
          ['183E19-5','Housing Set'],['263005-3','Rubber Pin 6'],['252126-6','Hex Locking Nut M4-7'],['852L52-7','DHP483 Name Plate'],['266429-2','Tapping Screw 3x16'],['457020-9','Speed Change Lever'],['233025-1','Compression Spring 2'],['419041-9','F/R Change Lever'],['650689-0','Switch C3JW-2B'],['251468-5','Flat Head Screw M6x22'],['763241-6','Keyless Drill Chuck 13'],['123587-6','Change Lever Assy'],['123867-0','Gear Assembly'],['266490-9','Tapping Screw PT 2x6'],['620555-5','Controller'],['629228-7','Stator'],['619410-6','Rotor'],['643874-2','Terminal'],['620549-0','LED Circuit'],['251314-2','+ Screw M4x12'],['346317-0','Hook'],['450128-8','Battery Cover'],['197600-6','Battery BL1830B Set'],['197280-8','Battery BL1850B Set']
        ]
      },
      DDF083: {
        title: 'Makita DDF083',
        type: '18V Brushless Bohrschrauber / 1/4\" Hex',
        pdfs: [
          {label:'Makita Thailand Produktseite', url:'https://www.makita.co.th/productinfo.php?pid=4553'},
          {label:'Direkter PDF-Link Parts List', url:'https://www.makita.co.th/pdf/productv2/638599227762809084PartListDDF083.pdf'},
          {label:'PartshopDirect Teileübersicht', url:'https://www.partshopdirect.co.uk/makita-ddf083-18v-lxt-brushless-14-635mm-drill-driver-spare-parts-s18527/'}
        ],
        parts: [
          ['183E19-5','Housing Set'],['263005-3','Rubber Pin 6'],['252126-6','Hex Locking Nut M4-7'],['852M58-1','DDF083 Name Plate'],['266429-2','Tapping Screw 3x16'],['457020-9','Speed Change Lever'],['233025-1','Compression Spring 2'],['419041-9','F/R Change Lever'],['650689-0','Switch C3JW-2B'],['123587-6','Change Lever Assy'],['123869-6','Gear Assembly'],['266490-9','Tapping Screw PT 2x6'],['620555-5','Controller'],['629228-7','Stator'],['619410-6','Rotor'],['643874-2','Terminal'],['216019-1','Steel Ball 3'],['326677-6','Bit Sleeve'],['233005-7','Compression Spring 13'],['347004-4','Bit Washer'],['231965-7','Ring Spring 10'],['620549-0','LED Circuit'],['251314-2','+ Screw M4x12'],['346317-0','Hook'],['450128-8','Battery Cover'],['197600-6','Battery BL1830B Set'],['197280-8','Battery BL1850B Set']
        ]
      }
    };

    const allPartSets = Object.values(models).map(m => new Set(m.parts.map(p => p[0])));
    const commonPartNumbers = [...allPartSets[0]].filter(n => allPartSets.every(s => s.has(n))).sort();
    const descLookup = {};
    Object.values(models).forEach(m => m.parts.forEach(([n,d]) => { if (!descLookup[n]) descLookup[n] = d; }));

    const modelList = document.getElementById('modelList');
    const modelView = document.getElementById('modelView');
    const commonView = document.getElementById('commonView');
    const showCommonBtn = document.getElementById('showCommon');
    let activeModel = 'DDF483';

    function renderSidebar() {
      modelList.innerHTML = Object.entries(models).map(([key, model]) => `
        <button class="model-btn ${key === activeModel ? 'active' : ''}" data-model="${key}">
          <strong>${model.title}</strong>
          <span>${model.type}</span>
        </button>
      `).join('');
      [...modelList.querySelectorAll('[data-model]')].forEach(btn => {
        btn.addEventListener('click', () => {
          activeModel = btn.dataset.model;
          renderSidebar();
          renderModel();
        });
      });
    }

    function partRows(parts, query='') {
      const q = query.trim().toLowerCase();
      const filtered = parts.filter(([num, desc]) => !q || num.toLowerCase().includes(q) || desc.toLowerCase().includes(q));
      if (!filtered.length) return '<div class="empty">Keine Treffer für deine Suche.</div>';
      return `
        <table>
          <thead><tr><th>Teil-Nr.</th><th>Beschreibung</th><th>Status</th></tr></thead>
          <tbody>
            ${filtered.map(([num, desc]) => `<tr><td>${num}</td><td>${desc}</td><td>${commonPartNumbers.includes(num) ? '<span class="pill">In allen 3 Modellen</span>' : 'Modellspezifisch'}</td></tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    function renderModel() {
      const model = models[activeModel];
      modelView.innerHTML = `
        <div class="card-grid">
          <section class="card">
            <h3>${model.title}</h3>
            <p class="muted">${model.type}. Unterhalb findest du die hinterlegte Teileliste und oben die direkt nutzbaren Quellen für Explosionszeichnung und Parts Breakdown.</p>
            <div class="pdf-links" style="margin-top: var(--space-4);">
              ${model.pdfs.map(pdf => `<a href="${pdf.url}" target="_blank" rel="noopener noreferrer">↗ ${pdf.label}</a>`).join('')}
            </div>
          </section>
          <section class="card">
            <h3>Übersicht</h3>
            <div class="stats">
              <div class="stat"><div class="label">Modell</div><div class="value">${activeModel}</div></div>
              <div class="stat"><div class="label">Hinterlegte Teile</div><div class="value">${model.parts.length}</div></div>
              <div class="stat"><div class="label">Gemeinsam mit allen 3</div><div class="value">${model.parts.filter(([n]) => commonPartNumbers.includes(n)).length}</div></div>
            </div>
          </section>
        </div>
        <div class="search-row">
          <input id="partSearch" type="search" placeholder="Suche nach Teilenummer oder Beschreibung, z. B. 620555-5 oder controller" />
        </div>
        <div id="partsTable">${partRows(model.parts)}</div>
      `;
      const input = document.getElementById('partSearch');
      input.addEventListener('input', () => {
        document.getElementById('partsTable').innerHTML = partRows(model.parts, input.value);
      });
      renderCommon(false);
    }

    function renderCommon(scrollIntoView=true) {
      commonView.innerHTML = `
        <section class="card">
          <h3>Teile, die in allen drei Modellen identisch sind</h3>
          <p class="muted">Hier werden nur Teilenummern gezeigt, die in DDF483, DHP483 und DDF083 jeweils identisch vorkommen.</p>
          <div style="margin-top: var(--space-4);">
            <table>
              <thead><tr><th>Teil-Nr.</th><th>Beschreibung</th><th>Verwendung</th></tr></thead>
              <tbody>
                ${commonPartNumbers.map(num => `<tr><td>${num}</td><td>${descLookup[num]}</td><td>DDF483 / DHP483 / DDF083</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
      if (scrollIntoView) commonView.scrollIntoView({behavior:'smooth', block:'start'});
    }

    document.querySelector('[data-theme-toggle]').addEventListener('click', () => {
      const root = document.documentElement;
      root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    showCommonBtn.addEventListener('click', () => renderCommon(true));

    renderSidebar();
    renderModel();
  </script>
</body>
</html>
